# This subtree is byte-for-byte equivalent after YAML parsing to SPEC_PAYLOAD
# in src/leanfaith/representations/goal_v1.py. Tests enforce the equality.
spec:
  representation_id: goal_v1.0
  renderer_version: goal_v1.0
  declaration_kinds: [lemma, theorem]
  grammar:
    local_line: "<one-or-more local names> : <Lean type>"
    target_line: "⊢ <Lean proposition>"
    turnstile_count: 1
    line_policy: "adjacent equal-type locals group; target is final"
    term_binding_policy: >-
      complete semicolon-delimited term let/have bindings in local types or the target at any
      delimiter depth are serialized on one logical line; ambiguous or layout-only bindings fail
      closed
    binding_keyword_policy: >-
      surface let/have and elaborated have bindings canonicalize to let; raw source keeps its
      original spelling
    anonymous_arrow_policy: >-
      a nondependent explicit anonymous/macro-scoped generated Pi remains arrow notation in the target;
      surface arrow syntax is preserved, while truly anonymous implicit/instance or dependent Expr
      binders fail closed
    binding_head_policy: >-
      surface binding heads require one original-token plain or guillemet explicit non-pattern name;
      elaborated and final validation additionally admit Lean's printed inaccessible-name suffix; an
      optional type annotation is nonempty with no second top-level colon, and
      reserved/literal/composite or incomplete heads fail closed
    local_name_policy: >-
      surface binders require original-token plain or guillemet explicit names; elaborated and final
      local lines additionally admit Lean's printed inaccessible-name suffix;
      reserved/literal/composite names fail closed
    forall_binder_type_policy: >-
      a bare top-level forall binder is accepted only when its comma boundary is unique; otherwise
      the binder must be parenthesized so nested quantifier and target commas cannot be mistaken for
      the binder boundary
    fragment_completion_policy: >-
      the containing expression plus each binding type, value, and body rejects dangling
      commas/operators and incomplete if/fun/quantifier/show introducers at every balanced delimiter
      depth; by/do/calc/match fragments fail closed
    literal_policy: >-
      strings, raw strings, guillemets, and Char tokens in types/values/bodies are opaque to
      delimiter analysis and preserved byte-for-byte during layout whitespace normalization;
      binding heads retain original token kind so literals cannot masquerade as names
    delimiter_policy: >-
      parentheses, braces, brackets, and constructor angles are balanced structurally; binding :=
      and ; cannot belong to compound delimiter/operator runs; dangling operators fail closed while
      supported atomic symbol terms remain values
    named_argument_policy: >-
      outside a claimed let/have binding, := is accepted only as a complete simple parenthesized
      named argument (name := value) or as one field of a complete comma-delimited structure
      literal; every other nested assignment fails closed
    targeted_token_policy: >-
      paired bars have nonempty unpadded interiors, brace-local set builders have exactly one
      unambiguous separator, compound bar operators are unsupported and fail closed, set image '' is
      whitespace-delimited with complete operands, factorial/positive-Nat/floor postfixes are
      narrowly recognized, floor/ceiling interiors are nonempty, and ⟪u,v⟫ has exactly two
      nonempty top-level operands
    surface_input_policy: >-
      surface rendering requires nonempty raw_statement plus caller-supplied parsed_signature;
      supplying it attests that the signature is complete, corresponds to compilable raw source in
      the stored context, and is safe for the bounded grammar; raw_statement is never parsed to guess
      a signature or proof boundary because loaded syntax makes top-level := ambiguous
    surface_provenance_tag: trusted_complete_parsed_signature
    surface_provenance_policy: >-
      each successful surface sidecar stores surface_provenance_tag in record.warnings as a
      caller-attestation marker that does not verify the attested claims; failures produce no
      sidecar or provenance tag
  preserve:
    - local_order
    - local_names
    - dependent_types
    - generated_instance_names_when_elaborated
    - coercions
    - notation_except_term_binding_have_canonicalized_to_let
    - universes_in_types
  remove:
    - attributes
    - declaration_keyword
    - declaration_name
    - command_shell
    - imports
    - options
    - comments
    - proof_delimiter
    - proof_body
  sources: [closed_prop_expr, elaborated, surface]
  # Descriptive classes, not a one-to-one list of SurfaceFailureCode enum values.
  surface_fail_closed_classes:
    - anonymous_instance_binder
    - duplicate_or_shadowed_local_name
    - implicit_or_untyped_binder
    - ambiguous_declaration_or_proof_boundary
    - incomplete_or_ambiguous_term_binding
    - assignment_syntax_outside_bounded_term_bindings
    - missing_trusted_complete_parsed_signature
    - raw_declaration_boundary_inference_forbidden
    - syntax_quotation
    - unsupported_declaration_kind
  compile_context_fields:
    - schema_version
    - project_id
    - project_revision
    - lean_version
    - import_header
    - command_preamble
    - namespace_context
    - open_context
    - scoped_context
    - options
  compile_context_application_order:
    - import_header
    - command_preamble
    - options
    - open_context
    - scoped_context
    - namespace_context
  elaborated_input_modes: [inline_candidate, loaded_constant_lookup]
  closed_expr_route:
    route_id: closed_expr_in_session
    input_mode: closed_prop_expr
    expr_origin_modes:
      - loaded_constant_type
      - term_elaborated_proposition
      - sft1_transformed_expr
    origin_source_material:
      loaded_constant_type: raw_statement
      term_elaborated_proposition: proposition_text
      sft1_transformed_expr: constructed_expr_no_source_text
    same_meta_request: true
    text_renderer: LeanFaith.GoalV1.renderClosedProp
    declaration_or_proof_creation: forbidden
    meta_action_command_policy: >-
      begin with the sole run_meta command and contain no declaration command; static project or
      helper setup belongs only in the hash-bound compile context
    compile_context_proof_declarations: forbidden
    kernel_preparation_passes_per_endpoint: 1
    surface_or_text_reelaboration: forbidden
    python_expr_transport: forbidden
  closed_expr_rejection_classes:
    - unresolved_expr_mvar
    - unresolved_universe_mvar
    - free_variable
    - loose_bound_variable
    - sorry_expr
    - malformed_expr
    - non_prop
    - unsupported_anonymous_telescope_binder
  closed_expr_hash:
    algorithm: sha256_canonical_closed_expr_alpha_tree_v1
    preimage: canonical JSON of the validated universe-normalized alpha Expr tree
    binder_names: excluded
    binder_info: retained
    mdata: transparent
    rendered_goal_hash: recorded separately to bind presentation names
  canonical_universe_profile:
    profile_id: goal_v1_first_occurrence_u_i_v1
    route_scope: closed_prop_expr_elaborated_named_and_supported_surface
    expr_input_stage: after_instantiate_mvars_and_closed_prop_validation
    parameter_order: Lean.collectLevelParams structural first occurrence
    expr_instantiation: replace every used Level.param in collected order on every Expr render
    surface_policy: >-
      rewrite explicit simple Type/Sort level names by textual first occurrence; reject star,
      inferred, and compound surface level syntax
    canonical_name_template: u_<zero_based_index>
    unused_declaration_parameters: omitted
  canonical_universe_profile_hash: d9e729134fcd6a086a58191810a9227062c66496ebe76b8da3c458a58b31cb61
  renderer_semantic_contract:
    hash_basis: sha256_canonical_renderer_semantics_v1
    namespace: LeanFaith.GoalV1
    signature: "renderClosedProp (e : Expr) : MetaM String"
    named_delegate: "renderConstantType (ci : ConstantInfo) := renderClosedProp ci.type"
    closed_expr_route: closed_expr_in_session
    single_text_renderer: true
    state_policy: withoutModifyingMCtx
    ambient_context_policy: clear_local_context_and_local_instances_before_render
    transparency_policy: Meta.TransparencyMode.default
    preparation_policy: one instantiate_check_isProp_normalize pass per render or payload
    metadata_policy: recursively_erase_before_check_hash_and_render
    exception_policy: interrupt_and_runtime_exceptions_are_rethrown
    anonymous_binder_policy: >-
      open user-named outer Pis as locals; retain nondependent explicit anonymous or macro-scoped
      generated Pis as target arrows; reject dependent or nonexplicit truly anonymous outer Pis
    failure_codes:
      - goal_v1_unresolved_expr_mvar
      - goal_v1_unresolved_universe_mvar
      - goal_v1_free_variable
      - goal_v1_loose_bound_variable
      - goal_v1_sorry_expr
      - goal_v1_malformed_expr
      - goal_v1_not_prop
      - goal_v1_unsupported_anonymous_telescope_binder
  renderer_semantic_hash: 0bec5429cc0e539841208be53cd52189a7b80cbdb4649ee2d45b84bd8a5ef1fd
  render_context:
    context_id: goal_v1_render_context_v1
    renderer_semantic_hash: 0bec5429cc0e539841208be53cd52189a7b80cbdb4649ee2d45b84bd8a5ef1fd
    universe_profile_id: goal_v1_first_occurrence_u_i_v1
