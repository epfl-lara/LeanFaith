protocol_version: backbone_pilot_v1
adr: docs/adr/ADR-0004-encoder-tokenizer.md
representation_bundle: [headless, signature_explicit]
context_rule:
  use_512_only_if:
    conclusion_retention: 1.0
    complete_binder_hypothesis_retention: 0.99
  otherwise: 1024
  native_context_support_required: true
  preserve_exclusions_as_slice: long_input
training:
  pair_count: 50000
  use_all_if_fewer: true
  positive_fraction: 0.5
  negative_fraction: 0.5
  optimizer: AdamW
  learning_rates: [0.000005, 0.00001, 0.00002]
  weight_decays: [0.01, 0.1]
  tuning_seeds: [1729]
  confirmation_seeds: [2718, 3141, 5772]
  equal_example_exposure: true
  equal_effective_batch_size: true
selection_gold_minimum_groups:
  faithful: 100
  unfaithful: 100
  per_confirmatory_relation_class: 50
selection:
  bootstrap: hierarchical_paired_seeds_and_ancestry_groups
  simultaneous_one_sided_confidence: 0.95
  auprc_noninferiority_margin: 0.01
  relation_macro_f1_noninferiority_margin: 0.02
  winner: highest_median_cached_reference_batch32_throughput
  throughput_tie_fraction: 0.05
  tie_breakers: [lower_peak_memory, fewer_loaded_parameters, lexicographic_model_id]
