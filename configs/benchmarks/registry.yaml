  minif2f_variants:
    registry_key: minif2f_variants
    display_name: "miniF2F variants"
    identity: resolve_at_freeze
    identity_kind: umbrella_enumerate_at_freeze
    revision: resolve_at_freeze
    citation: resolve_at_freeze
    usage: evaluation_only
    freeze_artifacts:
      ids: pending_phase_2
      nl_hashes: pending_phase_2
      raw_hashes: pending_phase_2
      representation_signatures: append_end_of_phase_3
    notes: >-
      Special rule: variants are plural. This is an umbrella entry; the
      Phase 2 freeze enumerates every compatible Lean 4 miniF2F variant
      individually with its own identity, revision, and hashes, and all
      enumerated variants inherit this entry's denylist and evaluation_only
      status. No result may cite "miniF2F" without naming the exact variant
      and revision used.
