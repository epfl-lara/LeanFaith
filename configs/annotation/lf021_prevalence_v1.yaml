tooling:
  selected_backend: null
  permitted_existing_backends:
    - argilla
    - label_studio
  fallback_backend: streamlit_only_after_documented_existing_tool_failure
  backend_project_created: false
  external_service_calls_allowed: false

annotation_design:
  annotations_per_item: 2
  annotator_slots:
    - slot_id: independent_annotator_1
      assigned_annotator: null
    - slot_id: independent_annotator_2
      assigned_annotator: null
  assignments_materialized: false
  independent_before_lock: true
  reveal_peer_identity: false
  reveal_peer_response: false
  fixed_side_semantics:
    A: registered_reference_lean_statement
    B: candidate_autoformalization_lean_statement
    swap_sides_in_ui: false

input_contract:
  payload_mode: allowlist_only
  task_mode: reference_assisted_nl_plus_lean_a_b
  required_display_fields:
    - natural_language_statement
    - lean_a.headless
    - lean_a.signature_pp
    - lean_a.signature_explicit
    - lean_b.headless
    - lean_b.signature_pp
    - lean_b.signature_explicit
  required_views_per_lean_side:
    - headless
    - signature_pp
    - signature_explicit
  permitted_context_fields:
    - minimal_import_text
    - namespace_text
    - local_notation_text
    - required_type_information
    - view_unavailable_notices
  source_private_content_allowed: false
  raw_frame_record_allowed: false
  raw_proof_stripped_allowed: false
  model_or_sampling_metadata_allowed: false

response_contract:
  schema_source: annotation/templates/lf021_prevalence_v1.json#response_schema
  persisted_record_schema: src/leanfaith/schemas/annotation.py#AnnotationRecord
  required_fields:
    - same_claim
    - relation
    - confidence
    - rationale
    - reference_issue
  optional_fields:
    - error_types
  semantic_relation_values:
    - equivalent
    - A_stronger
    - B_stronger
    - incomparable
    - unrelated
    - ambiguous
  unresolved_semantic_relation: null
  unknown_relation_spelling_allowed: false
  cannot_assess_derivation:
    same_claim: null
    resolution_outcome: unresolved
    relation: null
    quality_tier: unknown
    requires_adjudication: true
    decision: REVIEW

blinding:
  mode: allowlist_display_fail_closed_recursive_denylist
  applies_to: annotation_display_payload_before_annotator_access
  does_not_apply_to:
    - response_schema_field_names
    - locked_response_records
  denylist_source: annotation/codebook_v1.yaml#blinding
  reject_unlisted_top_level_fields: true
  reject_unlisted_nested_fields: true
  reject_prohibited_fields_even_when_null: true
  reject_prohibited_fields_even_when_redacted: true
  hidden_categories:
    - generator_model_checkpoint_provider
    - prompt_decoding_reasoning
    - tranche_invocation_pool_source_proxy
    - sampling_stratum_probability_multiplicity
    - frame_population_cluster_and_raw_identifiers
    - existing_semantic_placeholders_expected_labels_and_gate_fields
    - metric_scores_structural_scores_and_predictions
    - proof_defeq_counterexample_and_other_symbolic_evidence
    - llm_judgments_prior_human_votes_and_adjudication
    - benchmark_split_denylist_and_contamination_metadata
    - artifact_paths_hashes_context_ids_and_runtime_metadata
    - nonpermitted_representation_views
    - mutation_intentions_sci_and_E_code_provenance
  audit_before_payload_materialization: required
  audit_before_backend_import: required

domain_separators:
  frame_sampling:
    value: leanfaith-lf021-frame-v3-hmac-sha256-v1
    source: frozen_frame_decision
  payload_content_id:
    value: leanfaith-lf021-prevalence-annotation-payload-v1
    message_encoding: utf8_domain_nul_frame_id_nul_frame_record_id_nul_payload_sha256_v1
  opaque_item_token:
    value: leanfaith-lf021-prevalence-annotation-item-token-v1
    message_encoding: utf8_domain_nul_frame_id_nul_frame_record_id_v1
  independent_assignment:
    value: leanfaith-lf021-prevalence-annotation-assignment-v1
    message_encoding: utf8_domain_nul_campaign_id_nul_round_id_nul_item_token_v1
  display_order:
    value: leanfaith-lf021-prevalence-annotation-order-v1
    message_encoding: utf8_domain_nul_campaign_id_nul_round_id_nul_item_token_v1
  response_record:
    value: leanfaith-lf021-prevalence-annotation-response-v1
    message_encoding: utf8_domain_nul_campaign_id_nul_item_token_nul_slot_id_nul_response_sha256_v1
  adjudication_record:
    value: leanfaith-lf021-prevalence-adjudication-v1
    message_encoding: utf8_domain_nul_campaign_id_nul_item_token_nul_raw_response_ids_v1
  contains_secret_material: false

adjudication:
  enabled: false
  trigger_source: annotation/codebook_v1.yaml#adjudication_triggers
  preserve_raw_responses: true
  overwrite_raw_response: false

outputs:
  payload_export: null
  assignment_manifest: null
  annotation_records: null
  adjudication_records: null
  label_keys: null
  prevalence_report: null

launch_guard:
  execution_enabled: false
  backend_project_created: false
  payloads_materialized: false
  exports_materialized: false
  assignments_materialized: false
  annotator_keys_materialized: false
  responses_materialized: false
  semantic_labels_created: false
  external_calls_performed: false
  gate_5_closed: false
  rules:
    - this_configuration_alone_never_creates_a_label
    - this_configuration_alone_never_creates_an_assignment
    - this_configuration_alone_never_exports_frame_content
    - no_external_call_is_authorized
    - all_payloads_must_pass_the_recursive_blinding_audit
    - both_independent_responses_must_lock_before_peer_reveal
