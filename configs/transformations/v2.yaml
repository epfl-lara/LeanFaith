schema_version: 1
portfolio_id: leanfaith_deterministic_v2_design
portfolio_version: 1.0.0
status: design_only

# These hashes bind the already accepted v1 decision. LF-031 adds a separate
# design portfolio and must never mutate or reinterpret any v1 byte.
accepted_v1:
  registry_path: configs/transformations/registry.yaml
  registry_sha256: 5b8941264d1223069d6cb8c49b54e6e719abf3961820cd9d979113164db9d786
  profile_path: configs/transformations/v1.yaml
  profile_sha256: 9396c50fc088384e4085d95841f1c38ef898f3348580b4be15584e4edc03c2da
  promotion_policy_path: policies/transformation_promotion_v1.yaml
  promotion_policy_sha256: e41064eb4a6572d0283821ce7b9be21d211d8f149afe00d62e3e241446941cf3
  effective_registry_hash: 8a5316dacba064d9b3b13e12dfd46cd707445ecc520101a9374463f336f6466f

coverage_probe:
  detector_version: v2_coverage_signals_v1
  interpretation: upper_bound_signal_not_applicability
  required_views: [headless, raw_proof_stripped]
  probe_only: true
  executes_lean: false
  mutates_input_data: false
  emits_drafts: false
  emits_labels: false

# Every entry is design-only and disabled. A later LF item must create a new,
# versioned execution profile and generation addendum before any rule exists.
families:
  - family_id: n11_bound_variable_substitution
    family_version: 1.0.0
    polarity: negative
    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E16, E26]
    detector: same_typed_binders
    narrow_scope: Replace one explicit occurrence with a distinct in-scope binder of the same alpha-normalized type.
    excluded_cases:
      - dependent binder types
      - identical source and target binders
      - implicit or instance binders
      - role-sensitive function argument slots owned by N17
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

  - family_id: n12_implication_converse
    family_version: 1.0.0
    polarity: negative
    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E26, E30]
    detector: implication_surface
    narrow_scope: Swap distinct root nondependent proposition hypothesis and conclusion roles.
    excluded_cases:
      - Iff conclusions
      - dependent implications
      - nested implications
      - proposition-identical sides
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

  - family_id: n13_witness_dependency
    family_version: 1.0.0
    polarity: negative
    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E05, E22]
    detector: forall_exists_nesting
    narrow_scope: Swap one forall-exists nesting when the witness type is independent of the universal binder.
    excluded_cases:
      - dependent witness types
      - implicit or instance binders
      - more than one quantifier swap
      - nested connective normalization
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

  - family_id: n14_negation_scope
    family_version: 1.0.0
    polarity: negative
    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E04, E26]
    detector: negation_quantifier
    narrow_scope: Move one Not across one explicit universal binder without logical normalization.
    excluded_cases:
      - De Morgan rewriting
      - classical dualization
      - implicit or instance binders
      - multiple quantifiers
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

  - family_id: n15_conjunct_omission
    family_version: 1.0.0
    polarity: negative
    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E20, E26]
    detector: conjunction_surface
    narrow_scope: Remove one distinct top-level conclusion conjunct while retaining the surviving atom order.
    excluded_cases:
      - conjunction reassociation owned by P16
      - duplicate conjuncts
      - hypothesis deletion owned by N03
      - nested conjunct omission
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

  - family_id: n16_domain_guard_removal
