overlap_ownership:
  - mechanism_id: bound_variable_occurrence
    owner_family_id: n11_bound_variable_substitution
    excluded_family_ids: [n17_role_sensitive_arguments]
    rationale: N11 owns bare binder occurrences; N17 is restricted to allowlisted function slots.
  - mechanism_id: bounded_quantifier_presentation
    owner_family_id: p11_bounded_quantifiers
    excluded_family_ids: [n16_domain_guard_removal]
    rationale: P11 may only change presentation while N16 owns semantic guard deletion.
  - mechanism_id: conjunct_omission
    owner_family_id: n15_conjunct_omission
    excluded_family_ids: [p16_conjunction_reassociation]
    rationale: N15 owns removal and may not claim reassociation-only sites.
  - mechanism_id: conjunction_reassociation
    owner_family_id: p16_conjunction_reassociation
    excluded_family_ids: [n15_conjunct_omission]
    rationale: P16 preserves all atoms while N15 removes one atom.
  - mechanism_id: constructor_surface
    owner_family_id: p10_constructors
    excluded_family_ids: [p09_projections]
    rationale: Constructor syntax and projection syntax use disjoint expression nodes.
  - mechanism_id: domain_guard_removal
    owner_family_id: n16_domain_guard_removal
    excluded_family_ids: [n15_conjunct_omission, p11_bounded_quantifiers]
    rationale: N16 owns bounded guards; generic conjunct omission and presentation rewrites are excluded.
  - mechanism_id: elaborated_coercion_hop
    owner_family_id: p07_coercion_surface
    excluded_family_ids: [p08_type_ascriptions]
    rationale: P07 requires an elaborated coercion node; a surface ascription alone belongs to P08.
  - mechanism_id: projection_surface
    owner_family_id: p09_projections
    excluded_family_ids: [p07_coercion_surface, p10_constructors]
    rationale: P09 owns direct projection nodes and excludes coercion or constructor edits.
  - mechanism_id: proof_arrow_presentation
    owner_family_id: p12_proof_arrow_binder
    excluded_family_ids: [n12_implication_converse, p17_hypothesis_packing]
    rationale: P12 changes one unused proof-binder presentation without swapping or packing claims.
  - mechanism_id: role_sensitive_argument_slot
    owner_family_id: n17_role_sensitive_arguments
    excluded_family_ids: [n11_bound_variable_substitution]
    rationale: N17 requires an allowlisted head-position pair; N11 cannot operate there.
  - mechanism_id: root_iff_reversal
    owner_family_id: p15_root_iff_reversal
    excluded_family_ids: [n12_implication_converse]
    rationale: Root Iff reversal is separate from implication converse.
  - mechanism_id: root_implication_converse
    owner_family_id: n12_implication_converse
    excluded_family_ids: [p15_root_iff_reversal]
    rationale: N12 operates only on implication and cannot consume Iff sites.
  - mechanism_id: syntactic_type_ascription
    owner_family_id: p08_type_ascriptions
    excluded_family_ids: [p07_coercion_surface]
    rationale: P08 owns surface ascriptions without claiming an elaborated coercion hop.

mechanism_holdouts:
  - mechanism_superclass: connective_scope_delta
    family_ids: [n12_implication_converse, n14_negation_scope, n15_conjunct_omission, n16_domain_guard_removal]
  - mechanism_superclass: local_eta
    family_ids: [p13_restricted_eta]
  - mechanism_superclass: proposition_packaging
    family_ids: [p14_independent_binder_permutation, p15_root_iff_reversal, p16_conjunction_reassociation, p17_hypothesis_packing]
  - mechanism_superclass: quantifier_dependency_delta
    family_ids: [n13_witness_dependency]
  - mechanism_superclass: surface_presentation
    family_ids: [p05_resolved_names, p06_implicit_arguments, p07_coercion_surface, p08_type_ascriptions, p09_projections, p10_constructors, p11_bounded_quantifiers, p12_proof_arrow_binder]
  - mechanism_superclass: variable_role_delta
    family_ids: [n11_bound_variable_substitution, n17_role_sensitive_arguments]

runtime_registry_created: false
any_family_executable: false
draft_emission_authorized: false
label_emission_authorized: false
