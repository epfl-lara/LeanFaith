    status: disabled
    implementation_status: design_only
    evidence_class: D0
    intended_relation: near_miss
    intended_error_types: [E01, E20, E26]
    detector: bounded_guard
    narrow_scope: Remove exactly one bounded-quantifier membership guard and preserve the quantified body.
    excluded_cases:
      - arbitrary hypothesis deletion owned by N03
      - bounded presentation changes owned by P11
      - conjunct omission owned by N15
      - multiple guards
    executable: false
    draft_emission_authorized: false
    label_emission_authorized: false

