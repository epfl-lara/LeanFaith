composition_grammar:
  maximum_total_operations: 3
  admitted_statuses_after_operation_approval: [implementation_candidate, proof_of_concept]
  diagnostic_operations_may_emit_rows: false
  positive_terminal: admitted_positive_operation
  negative_terminal: admitted_n_rubric_or_n_proof_operation
  productions:
    - "positive_row := P"
    - "positive_row := P P"
    - "positive_row := P P P"
    - "negative_row := N"
    - "negative_row := P N"
    - "negative_row := P P N"
  post_negative_operations_allowed: false
  positive_row_negative_operation_count: 0
  negative_row_negative_operation_count: 1
  all_sites_pairwise_disjoint_after_typed_rediscovery: true
  one_operation_per_mechanism_superclass: true
  repeated_inverse_tokens_rejected: true
  repeated_text_hashes_rejected: true
  repeated_closed_expr_hashes_rejected: true
  repeated_render_hashes_rejected: true
  repeated_selected_site_lineage_rejected: true
  direct_only_operation_ids: []
  mutual_exclusion_groups:
    - group_id: one_definitional_mechanism_per_chain
      maximum_members_per_chain: 1
      operation_ids:
        - P20_FOLD_SET_NONEMPTY_V1
        - P20_UNFOLD_SET_NONEMPTY_V1
        - P21_BETA_INTRO_V1
        - P21_BETA_REDUCE_V1
        - P21_ZETA_INTRO_V1
        - P21_ZETA_REDUCE_V1
        - P22_ETA_REDUCE_EXPLICIT_FUN_V1
  p01_alpha_fingerprint_repeat_exception:
    operation_id: P01_ALPHA_RENAME_SINGLE_V1
    maximum_uses_per_chain: 1
    may_repeat_alpha_fingerprint_once: true
    exception_applies_only_to_the_single_p01_hop: true
    may_repeat_expr_or_render_hash: false
  all_other_repeated_path_fingerprints_rejected: true
  current_typed_site_rediscovery_each_hop: true

