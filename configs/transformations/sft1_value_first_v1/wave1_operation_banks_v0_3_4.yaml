n31_guard_target_bank:
  bank_id: sft1_n31_guard_target_candidates_v0_3_4
  parent_design_path: configs/transformations/sft1_value_first_v1/wave1_n31_guard_bank_v0_3_2.yaml
  parent_design_file_sha256: c2a5aa63158ffbc561bc61f2e3acaa2598aff54a926fd774014e62e6c1cd8cd8
  status: authored_candidates_require_live_resolution
  all_selectable_entries_live_resolved: false
  all_retained_contradiction_patterns_live_resolved: false
  usable_for_gate_execution: false
  matching_semantics:
    head_name_match: exact_Name.toString
    symbolic_path_basis: recursive_offset_from_end_of_stripMData_getAppArgs_v1
    live_resolved_path_basis: recursive_zero_based_index_into_stripMData_getAppArgs_v1
    role_expr_match: exact_binder_aware_structure
    metadata_transparent: true
  retained_contradiction_lean_structure: LeanFaith.SFT1.Wave1.N31RetainedContradictionPattern
  retained_contradiction_patterns_are_not_selectable_or_dispatchable: true
  retained_prop_match_cardinality: exactly_one_across_selectable_and_contradiction_patterns_v1
  unknown_or_ambiguous_retained_prop_disposition: n31RetainedContextUnknownOrAmbiguous
  unknown_or_ambiguous_retained_prop_is_typed_not_applicable: true
  shape_entries:
    - shape_id: ne_zero_guard_v1
      guard_patterns:
        - {head_name: Ne, role_offsets_from_end: [1]}
      target_candidates:
        - {head_name: HDiv.hDiv, role_offsets_from_end: [0]}
        - {head_name: Inv.inv, role_offsets_from_end: [0]}
      blocks_removal_of: []
      contradiction_shape_ids: [eq_zero_retained_v1]
      live_resolved: false
    - shape_id: positive_guard_v1
      guard_patterns:
        - {head_name: LT.lt, role_offsets_from_end: [0]}
      target_candidates:
        - {head_name: Real.log, role_offsets_from_end: [0]}
      blocks_removal_of: [ne_zero_guard_v1, nonnegative_guard_v1]
      contradiction_shape_ids: [nonpositive_retained_v1]
      live_resolved: false
    - shape_id: nonnegative_guard_v1
      guard_patterns:
        - {head_name: LE.le, role_offsets_from_end: [0]}
      target_candidates:
        - {head_name: Real.sqrt, role_offsets_from_end: [0]}
      blocks_removal_of: []
      contradiction_shape_ids: [negative_retained_v1]
      live_resolved: false
    - shape_id: membership_guard_v1
      guard_patterns:
        - {head_name: Membership.mem, role_offsets_from_end: [1, 0]}
      target_candidates:
        - {head_name: Set.indicator, role_offsets_from_end: [1]}
      blocks_removal_of: []
      contradiction_shape_ids: [not_membership_retained_v1]
      live_resolved: false
    - shape_id: index_lt_guard_v1
      guard_patterns:
        - {head_name: LT.lt, role_offsets_from_end: [1, 0]}
      target_candidates:
        - {head_name: GetElem.getElem, role_offsets_from_end: [1, 0]}
      blocks_removal_of: []
      contradiction_shape_ids: [bound_le_index_retained_v1]
      live_resolved: false
  retained_contradiction_patterns:
    - shape_id: eq_zero_retained_v1
      contradicts_guard_shape_id: ne_zero_guard_v1
      encoding_id: ofnat_application_with_nat_literal_zero_v1
      head_name: Eq
      argument_count: null
      root_head_and_arity_live_resolution_verified: false
      role_paths: [{offsets_from_end: [1], live_resolution_verified: false}]
      instance_paths: []
      instance_path_resolution_required: true
      nested_head_constraints:
        - {path: {offsets_from_end: [0], live_resolution_verified: false}, head_name: OfNat.ofNat, argument_count: null, live_resolution_verified: false}
      literal_constraints:
        - {path: {offsets_from_end: [0, 1], live_resolution_verified: false}, literal_kind: nat, nat_value: 0, live_resolution_verified: false}
      exact_expr_constraints: []
      live_resolved: false
    - shape_id: nonpositive_retained_v1
      contradicts_guard_shape_id: positive_guard_v1
      encoding_id: ofnat_application_with_nat_literal_zero_v1
      head_name: LE.le
      argument_count: null
      root_head_and_arity_live_resolution_verified: false
      role_paths: [{offsets_from_end: [1], live_resolution_verified: false}]
      instance_paths: []
      instance_path_resolution_required: true
      nested_head_constraints:
        - {path: {offsets_from_end: [0], live_resolution_verified: false}, head_name: OfNat.ofNat, argument_count: null, live_resolution_verified: false}
      literal_constraints:
        - {path: {offsets_from_end: [0, 1], live_resolution_verified: false}, literal_kind: nat, nat_value: 0, live_resolution_verified: false}
      exact_expr_constraints: []
      live_resolved: false
    - shape_id: negative_retained_v1
      contradicts_guard_shape_id: nonnegative_guard_v1
      encoding_id: ofnat_application_with_nat_literal_zero_v1
      head_name: LT.lt
      argument_count: null
      root_head_and_arity_live_resolution_verified: false
      role_paths: [{offsets_from_end: [1], live_resolution_verified: false}]
      instance_paths: []
      instance_path_resolution_required: true
      nested_head_constraints:
        - {path: {offsets_from_end: [0], live_resolution_verified: false}, head_name: OfNat.ofNat, argument_count: null, live_resolution_verified: false}
      literal_constraints:
        - {path: {offsets_from_end: [0, 1], live_resolution_verified: false}, literal_kind: nat, nat_value: 0, live_resolution_verified: false}
      exact_expr_constraints: []
      live_resolved: false
    - shape_id: not_membership_retained_v1
      contradicts_guard_shape_id: membership_guard_v1
      encoding_id: not_membership_nested_application_v1
      head_name: Not
      argument_count: null
      root_head_and_arity_live_resolution_verified: false
      role_paths:
        - {offsets_from_end: [0, 1], live_resolution_verified: false}
        - {offsets_from_end: [0, 0], live_resolution_verified: false}
      instance_paths: []
      instance_path_resolution_required: true
      nested_head_constraints:
