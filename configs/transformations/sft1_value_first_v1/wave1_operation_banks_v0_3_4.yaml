  source_admission_symbol: LeanFaith.SFT1.Wave1.admittedN31BankIdentitiesV0_3_4
  admitted_resolved_bank_identity_count: 0
  admitted_resolved_bank_identities: []
  current_runtime_activation_authorized: false
  empty_admission_blocks_dispatch_and_discovery: true
  absent_bank_failure_reason: n31BankMissing
  unadmitted_bank_failure_reason: n31BankInvalid
  future_activation_requires_separate_user_authorization: true
  future_identity_pin_field_order:
    - projectId
    - bankId
    - resolvedLeanHash
    - resolutionReceiptHash
  exact_project_bank_resolved_lean_hash_resolution_receipt_pin_required: true
  in_process_exact_full_typed_bank_hash_verification_required: true
  in_process_exact_full_typed_bank_hash_verifier_bound: false
  identity_membership_is_not_a_substitute_for_bank_hash_verification: true
  verification_must_precede_dispatch_discovery_and_replay: true

n31_certificate_binding_contract:
  source_certificate_symbol: LeanFaith.SFT1.Wave1.N31RubricCertificate
