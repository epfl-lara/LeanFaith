  full_typed_bank_scope: identity_entries_retained_patterns_implications_contradictions_v1
  full_reachability_evidence_embedded_in_certificate: true
  full_reachability_scope: mode_guard_ordinal_ordered_assignment_exprs_v1
  reachability_assignment_equality: ordered_Expr.equal_v1
  replay_requires_supplied_bank_and_reachability_exact_equal: true
  mismatch_failure_reason: replayContextMismatch

n31_runtime_structural_constraints:
  selectable_guard_role_and_instance_indices_disjoint: true
  selectable_target_role_and_instance_indices_disjoint: true
  selectable_guard_instance_or_type_indices_nonempty: true
  selectable_target_instance_or_type_indices_nonempty: true
  retained_contradiction_role_and_instance_paths_disjoint: true
  retained_contradiction_instance_or_type_paths_nonempty: true
  exact_expr_constraints_must_be_clean_and_closed: true
  unresolved_symbolic_candidate_bank_is_runtime_inadmissible: true
  resolved_runtime_bank_must_satisfy_all_constraints: true

