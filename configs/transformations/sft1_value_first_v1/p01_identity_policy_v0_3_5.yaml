user_authorization:
  exact_user_text: |-
    I approve an additive SFT1 P01 identity-policy revision derived from commit `5ddda95d05fe4c0fcd755e042174ca50453ebd03`.

    Allow exactly one `P01_ALPHA_RENAME_SINGLE_V1` hop per chain, subject to the existing maximum of one retained P01 pair per root and 0.5% retained-share cap, to repeat only the immediately preceding alpha-invariant canonical closed-Expr hash when:

    - reference and candidate render hashes and model-facing texts differ;
    - the selected binder site is uniquely rediscovered;
    - the binder-aware exact name-only delta certificate binds the site, old and new names, and `BinderInfo`;
    - certificate replay proves that every non-name part of the Expr is unchanged; and
    - the candidate is the exact deterministic replay result.

    All other text, render, selected-site-lineage, operation, mechanism, inverse-token, duplicate, conflict, and cycle rules remain unchanged. Canonical unordered-pair deduplication and post-orientation global duplicate/conflict rejection remain mandatory.

    Implement this only through a new additive policy/loader/test overlay; do not modify frozen revision 0.3.4 artifacts. This approval may clear only the P01 identity blocker. Overall implementation readiness and gate execution must remain false because Lean compilation, live fixtures, certificate replay, the persistent Meta/REPR adapter, cache integration, N31 resolution, the shared-label contract, and smoke-root micro-censuses remain incomplete.

    This approval does not authorize Lean, transformation or gate execution, model-facing rows, production admission, Wave 2, 10K, scale, training, or publication.
  exact_user_text_sha256: ee6440aa41d56b0a7dbc15d15f89ef75c629bd6361685c2b70a65d0e49e59514
  recorded_date: "2026-08-31"
  interpretation: additive_p01_identity_policy_only_no_execution

