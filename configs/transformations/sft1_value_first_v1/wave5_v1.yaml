  salt: sft1_wave5_compiler_audit_v1
  multi_label_features:
    - equality
    - disequality
    - strict_order
    - non_strict_order
    - bounded_quantifier
    - existential
    - implication
    - membership
    - universe
    - typeclass
    - numeral
  length_dimensions: [signature, theorem, body, full_source]
  include_common_and_rare_context_fingerprints: true
  include_namespace_status_strata: true
  include_context_complexity_strata: true

execution:
  census_filter_join_dedup_before_lean: true
  inventory_uses_lean: false
  lean_workers_after_inventory: 2
  host_rss_ceiling_gib: 40
  elab_async: false

# Bounded compiler-context audit. The exact reconstructed source theorem and
# proof are checked before the shared typed Wave 3/Wave 4 certificate hook is
# allowed to consume that locally declared theorem.
compiler_audit:
  schema_version: sft1_compiler_context_audit_v1
  checker_version: sft1_wave5_compiler_context_replay_v1
  output_root: /storage/milikic/leanfaith/value_first/sft1_deterministic_v1/wave5/compiler_audit_v1
  project_dir: /storage/milikic/leanfaith/mathlib4
  engine_path: LeanFaith/Meta/SFT1/Sprint.lean
  resource_task: SFT1-WAVE5-AUDIT
  expected_rows: 1000
  memory_hard_limit_mb: 24576
  request_timeout_seconds: 900
  context_request_max_roots: 20
  request_batch_size: 8
  retry_max_attempts: 2
  retry_statuses: [crash, internal_error, timeout]
  isolate_incremental_commands: true
  terminal_marker: complete.json
  downstream_mode: proof_certified_typed_sft1_hook_v1

