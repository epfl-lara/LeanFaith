[project]
name = "leanfaith"
version = "0.1.0"
description = "LeanFaith: a calibrated learned faithfulness metric for Lean 4 autoformalization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Lazar Milikic" }]
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "lean-interact==0.11.4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
leanfaith = "leanfaith.cli.app:main"
leanfaith-eval = "leanfaith.eval.cli:main"
leanfaith-plans = "leanfaith.project_plans:main"
leanfaith-resources = "leanfaith.host_resources:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260518",
]
local-inference = [
    # Optional LF-021 runtime. These packages are not imported by LeanFaith's
    # normal extraction, representation, transformation, or test paths.
    "accelerate==1.14.0",
    "torch==2.13.0",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leanfaith"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Lean code fixtures legitimately contain math unicode and long statements.
"tests/**" = ["RUF001", "RUF002", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["leanfaith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
markers = [
    "lean: requires the Lean toolchain and the built fixture REPL (PR-Lean CI tier)",
    "slow: long-running local test excluded from quick task checks",
    "gpu: requires a CUDA-capable GPU and model dependencies",
    "network: requires external network access",
    "external_model: invokes a local or remote model outside the unit-test boundary",
]

[[tool.mypy.overrides]]
# The Appendix A.5 canonical block uses bare `dict`/`tuple[dict, ...]`;
# the block is reproduced verbatim (LF-005), so relax generics here only.
module = "leanfaith.lean.protocol"
disallow_any_generics = false

[[tool.mypy.overrides]]
# datasets ships no type stubs; only the lazy live-client path touches it.
module = ["datasets", "datasets.*"]
ignore_missing_imports = true
