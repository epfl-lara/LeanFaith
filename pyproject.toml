[project]
name = "leanfaith"
version = "0.1.0"
description = "LeanFaith: a calibrated learned faithfulness metric for Lean 4 autoformalization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Lazar Milikic" }]
dependencies = [
    "lean-interact==0.11.4",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
leanfaith = "leanfaith.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leanfaith"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["leanfaith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
# The Appendix A.5 canonical block uses bare `dict`/`tuple[dict, ...]`;
# the block is reproduced verbatim (LF-005), so relax generics here only.
module = "leanfaith.lean.protocol"
disallow_any_generics = false
