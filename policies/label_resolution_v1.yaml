# Label resolution policy v1 (PLAN.md sections 3.5, 11.8, 14.1-14.7, 15.7,
# 16.8). Consumed by the Phase 8 deterministic resolver and by schema
# validators. Loaded by the strict YAML loader: root mapping, no duplicate
# keys, no tabs. Only the canonical PLAN.md section 11.1 enums may ever be
# serialized; every proposer/judge/UI/benchmark spelling passes through the
# mapping tables in this file and never creates a new persisted spelling
# (PLAN.md 14.1). Enum spellings are defined once in the section 7.1 schema
# modules; this file references them and never redefines them.
policy_version: label_resolution_v1
status: "approved Phase 0 decision set; binding for the Phase 8 resolver"
source_of_truth: "PLAN.md sections 3.5, 11.8, 14.1-14.7, 15.7, 16.3-16.8"
companion_policies:
  semantic_policy: semantic_policy_v1
  error_ontology: error_ontology_v1

# ---------------------------------------------------------------------------
# 1. Decision precedence (PLAN.md 14.6), as ordered data. Lower rank wins.
# Precedence selects which source's candidate becomes the ResolvedLabel when
# candidates are consistent, or when a strong source overrides a weak one.
# It is decision precedence, not destructive overwrite: disagreement between
# strong sources is never settled by rank alone (see conflict_policy).
# ---------------------------------------------------------------------------
precedence:
  - rank: 1
    source: human_adjudication
    description: post-adjudication independent expert decision
    quality_tiers: [gold_human]
    strength: strong
  - rank: 2
    source: frozen_benchmark_policy
    description: label defined by a frozen external benchmark's own policy
    quality_tiers: [benchmark]
    strength: strong
  - rank: 3
    source: promoted_certificate_or_separator
    description: >-
      promoted conservative-transformation certificate or accepted
      kernel-checked separator/counterexample meeting the acceptance rules
      of PLAN.md 16.5 and 16.7
    quality_tiers: [gold_conservative_transform, gold_counterexample]
    strength: strong
  - rank: 4
    source: promoted_independent_consensus
    description: promoted independent weak supervision with audited precision
    quality_tiers: [silver_consensus]
    strength: weak
  - rank: 5
    source: generation_intention
    description: proposer/mining/smoke intention; never self-promotes
    quality_tiers: [provisional]
    strength: weak

override_rules:
  # decision: when a strong source (ranks 1-3) supersedes a weak source
  # (ranks 4-5), or a weak source supersedes a lower-ranked weak source, the
  # resolver applies the higher-ranked label, links the superseded candidate
  # in evidence_ids_used, and appends a non-blocking override log entry used
  # for family/consensus precision monitoring (PLAN.md 15.8). No review
  # route is created for these overrides.
  strong_over_weak: apply_and_log
  weak_over_weak: apply_higher_rank_and_log
  strong_over_strong_agreeing: apply_higher_rank_and_link_supporting_evidence
  strong_over_strong_disagreeing: conflict_policy   # never resolved by rank

# ---------------------------------------------------------------------------
# 2. Conflict policy (PLAN.md 14.6, 16.8): conflicting strong evidence
# creates a conflict record and a review route; nothing is overwritten.
# ---------------------------------------------------------------------------
conflict_policy:
  definition: >-
    Two sources of strength strong disagree on any of same_claim,
    resolution_outcome, relation, truth_A_implies_B, or truth_B_implies_A
    for the same target; or two accepted certificates for the same target
    are mutually inconsistent, for example an equivalence certificate plus
    a separator refuting a direction that the equivalence entails.
  on_conflict:
    - write_conflict_record
    - route_target_to_unresolved_review   # field contract in section 5
    - quarantine_conflicting_evidence_for_replay_recheck   # PLAN.md 16.7
  conflict_record_fields:
    - conflict_id
    - target_kind
    - target_id
    - conflicting_evidence_ids
    - conflicting_source_ranks
    - detected_at_utc
    - policy_version
    - notes
  no_destructive_overwrite: >-
    ResolvedLabel records are never mutated in place. Re-resolution writes a
    new label whose metadata carries a supersedes pointer to the old
    label_id; superseded labels and all conflict records are retained
    append-only for audit.
  exit: >-
    A conflicted target leaves the review route only through rank-1 human
    adjudication, or through a versioned frozen-benchmark errata decision
    for benchmark-defined items. The closing adjudication_notes must
    reference the conflict_id.
  human_vs_kernel_certificate: >-
    If human adjudication contradicts an accepted kernel-checked
    certificate, neither side is silently preferred: the mandatory
    quarantine recheck re-replays the certificate in the pinned context
    first. A certificate that survives replay normally indicates a context,
    alignment, or reading mismatch on the human side, and the adjudicator
    must address the surviving certificate explicitly before the conflict
    closes.
  weak_conflicts: >-
    Disagreement that involves only weak sources (ranks 4-5) is not a
    conflict in the above sense; the higher rank applies and the
    disagreement is logged per override_rules. Pre-adjudication
    disagreement between individual annotators is upstream of this policy
    and is handled by the adjudication workflow itself.

# ---------------------------------------------------------------------------
# 3. Negative promotion (PLAN.md 15.7): a mutation begins provisional and
# may become supervised by exactly one route. Additional consistent evidence
# is linked via evidence_ids_used but does not change the recorded route;
# inconsistent evidence triggers conflict_policy.
# ---------------------------------------------------------------------------
negative_promotion:
  exactly_one_route: true
  routes:
    - route_id: N1
      name: checked_counterexample_separator
      requires: >-
        accepted kernel-checked counterexample/separator in a supported
        decidable fragment (PLAN.md 16.5), passing certificate acceptance
        (PLAN.md 16.7)
      resulting_tier: gold_counterexample
    - route_id: N2
      name: one_direction_proof_plus_reverse_separator
      requires: >-
        accepted one-direction closed-truth proof plus an accepted separator
        refuting the reverse direction
      resulting_tier: gold_counterexample
      note: >-
        Sets a directional relation (A_stronger/B_stronger) only under a
        recorded binder alignment passing the semantic policy (PLAN.md 16.3
        mode 2); without an accepted alignment the relation stays
        incomparable_near_miss or unknown per semantic_policy_v1 section 3,
        even though same_claim=false and the truth fields are set.
    - route_id: N3
      name: expert_adjudication
      requires: independent expert labels plus adjudication
      resulting_tier: gold_human
    - route_id: N4
      name: independent_consensus_audited
      requires: >-
        promoted independent consensus plus audited precision meeting the
        PLAN.md 15.8 thresholds
      resulting_tier: silver_consensus
  never_qualifies:
    - high_confidence_mutation_intention   # no shortcut from intended labels
    - proof_search_not_proved              # PLAN.md 11.7, 15.7
    - counterexample_search_not_found      # PLAN.md 11.7, 15.7
    - native_decide_alone                  # mine/corroborate only, PLAN.md 16.6
    - elaboration_failure_alone            # handled by ValidationStatus, not promotion
  note: >-
    Positive promotion (same_claim=true above provisional) is governed by
    PLAN.md 15.8 family promotion and by human/benchmark labeling; it is
    out of scope for this section but uses the same precedence, conflict,
    and method-registry rules.

# ---------------------------------------------------------------------------
# 4. Resolution method registry.
# decision: resolution_method is a registry-controlled string and each
# method maps to exactly one promotion route (ResolvedLabel has no separate
# route field, PLAN.md 11.8, so the route must be derivable from the
# method). Adding a method requires a policy revision.
# ---------------------------------------------------------------------------
resolution_methods:
  registry:
    - method: separator_certificate
      route: N1
      tier: gold_counterexample
    - method: directional_proof_plus_separator
      route: N2
      tier: gold_counterexample
    - method: expert_adjudication
      route: N3
      tier: gold_human
    - method: expert_binder_aligned_claim_comparison   # PLAN.md appendix C.4
      route: N3
      tier: gold_human
    - method: independent_consensus_audited
      route: N4
      tier: silver_consensus
    - method_pattern: "{family_id}_alpha_certificate"   # example p01_alpha_certificate
      route: positive_conservative_family_promotion     # PLAN.md 15.8
      tier: gold_conservative_transform
    - method: benchmark_import   # decision: canonical spelling for frozen benchmark labels
      route: frozen_benchmark_policy
      tier: benchmark
    - method: smoke_alpha_certificate
      route: smoke_plumbing_only
      tier: provisional
      note: >-
        artifact_class=smoke only; can never enter release, selection,
        calibration, or scientific tables (PLAN.md 20).
  unresolved_route_method: null   # the review route carries no method

# ---------------------------------------------------------------------------
# 5. Mechanical F0/F1/F2 derivation (PLAN.md 14.7, 11.8, 16.8). The resolver
# computes these fields; an independent validator re-derives them from the
# linked evidence and rejects any mismatch.
# ---------------------------------------------------------------------------
f_derivation:
  F1_same_claim:
    rule: "always equal to same_claim; schema invariant, PLAN.md 11.8"
    null_when: same_claim is null
  F0_representation_equivalent:
    true_iff: >-
      an accepted admission-free definitional/representation-equivalence
      certificate in the pinned context, or a trusted human/benchmark
      adjudication, asserts representation equivalence
    false_iff: >-
      a trusted human/benchmark adjudication, or policy-accepted structural
      separating evidence, refutes representation equivalence
    else: null
    decision: >-
      a defeq check that errors, times out, or completes with value
      not_equal at a given transparency setting is NOT accepted refutation
      of representation equivalence; F0 stays null unless a trusted source
      sets it false. Only the positive defeq result (value equal, accepted
      certificate) is mechanical evidence.
  truth_direction_fields:
    fields: [truth_A_implies_B, truth_B_implies_A]
    true_iff: >-
      accepted admission-free closed-truth certificate for that direction
      (PLAN.md 16.3 mode 1, 16.7)
    false_iff: >-
      accepted checked separator/counterexample refuting that direction
      (PLAN.md 16.5)
    else: null
    failed_search: >-
      proof not_proved, counterexample not_found, timeout, error,
      unsupported, and abstain never set a truth field; the field stays
      null (PLAN.md 11.7, 15.7).
  F2_truth_equivalent:
    true_iff: "truth_A_implies_B == true and truth_B_implies_A == true"
    false_iff: "truth_A_implies_B == false or truth_B_implies_A == false"
    else: null
  firewall:   # evidence-to-label firewall, PLAN.md 16.8
    - mutual closed provability never directly assigns F1/same_claim true
    - a closed implication never directly assigns A_stronger or B_stronger
    - F2 true or false never lifts or lowers F1 (semantic_policy_v1 2.1, 2.8)
    - vacuity/ex-falso proofs are rejected as directional or truth evidence
    - a checked separator may set a truth direction false and support
      F1=false under policy, but never alone sets a directional relation
  impossible_combinations:
    # Fail schema validation unless an explicit policy exception is linked
    # (PLAN.md 14.7).
    - F2_truth_equivalent true with any truth direction false
    - F2_truth_equivalent false with both truth directions true
    - F2_truth_equivalent non-null with both truth directions null
    - F1_same_claim differing from same_claim
    - same_claim true with resolution_outcome other than same_claim
    - same_claim false with resolution_outcome other than not_same_claim
    - same_claim null with resolution_outcome same_claim or not_same_claim
    - truth direction false without an accepted separator evidence link

# ---------------------------------------------------------------------------
# 6. Field contracts: UNRESOLVED review route versus terminal AMBIGUOUS
# (PLAN.md 3.5, 14.2, 11.8).
# ---------------------------------------------------------------------------
field_contracts:
  unresolved_review_route:
    meaning: >-
      process route (the UNCERTAIN route); not a persisted semantic class
      and never a model class
    fields:
      same_claim: null
      resolution_outcome: unresolved
      relation: unknown
      F1_same_claim: null
      quality_tier: unknown
      requires_adjudication: true
      resolution_method: null
    f0_f2_note: >-
      decision: F0/F2 and the truth direction fields still derive
      mechanically from accepted evidence and may be non-null on the review
      route; only the claim-level fields above are pinned. Appendix C.7 of
      PLAN.md shows the all-null case because no evidence exists there.
    eligibility:
      binary_training_target: false
      final_evaluation: false
      workflow_analysis: true
  terminal_ambiguous:
    meaning: >-
      trusted terminal semantic outcome for genuinely ambiguous items;
      requires an adjudicated gold_human tier or a source-defined benchmark
      tier (PLAN.md 3.5, 14.2)
    fields:
      same_claim: null
      resolution_outcome: ambiguous
      relation: ambiguous
      F1_same_claim: null
      quality_tier: gold_human_or_benchmark   # benchmark only when source-defined
      requires_adjudication: false
    eligibility:
      binary_training_target: false           # masked from binary BCE
      headline_binary_metrics: false          # masked
      three_class_and_abstention_analysis: true
      released_audit_data: true
  distinction: >-
    The two contracts share same_claim=null and differ on every routing
    field; a validator rejects any label mixing them, for example
    resolution_outcome=ambiguous with quality_tier=unknown, or
    resolution_outcome=unresolved with requires_adjudication=false.

# ---------------------------------------------------------------------------
# 7. Interface mappings (PLAN.md 14.4). External spellings normalize and
# map; they never create new persisted spellings.
# ---------------------------------------------------------------------------
interface_mappings:
  normalization:
    # decision: external spellings are normalized before table lookup:
    # Unicode NFC, strip surrounding whitespace, lowercase, collapse runs of
    # whitespace and hyphens to a single underscore. Lookup is exact after
    # normalization.
    steps: [nfc, trim, lowercase, collapse_separators_to_underscore]
  proposer_to_intended_relation:
    # Targets IntendedRelation (intention-only). near_miss is never
    # persisted on a ResolvedLabel; resolved labels use RelationLabel with
    # incomparable_near_miss (PLAN.md 11.1).
    table:
      - inputs: [equivalent, same]
        intended_relation: equivalent
        default_error_types: []
        note: "E29 when the proposer flags a cosmetic-only edit"
      - inputs: [a_stronger]
        intended_relation: A_stronger
        default_error_types: policy_specific   # see directional_default_decision
      - inputs: [b_stronger]
        intended_relation: B_stronger
        default_error_types: policy_specific   # see directional_default_decision
      - inputs: [near_miss, non_directional_near_miss]
        intended_relation: near_miss
        default_error_types: [E26]
        note: "E26 unless the family registry names a more specific code"
      - inputs: [unrelated]
        intended_relation: unrelated
        default_error_types: [E26]
      - inputs: [unknown, malformed]
        intended_relation: unknown
        default_error_types: []
    directional_default_decision: >-
      decision: the default error code for a directional intention attaches
      to the mutated/candidate side of the pair: if that side is the weaker
      side of the intended relation the default is [E19]
      (special_case_only); if it is the stronger side the default is [E20]
      (overgeneralization). A transformation family registry entry may
      override with a more specific code. Default codes are intention
      metadata only and never enter a ResolvedLabel without resolution.
    unmatched: >-
      decision: an unrecognized proposer spelling maps to intended_relation
      unknown, sets parse_status accordingly on the LLM call record
      (PLAN.md 11.11), and is counted in proposer-format monitoring; it
      never invents an enum value.
  judge_to_resolution_candidate:
    # Judge outputs are resolution candidates entering precedence at the
    # rank of the judge's evidence class (normally rank 4 via consensus, or
    # rank 5); a judge answer alone never directly writes a ResolvedLabel.
    table:
      - answer: same_claim
        candidate:
          same_claim: true
          resolution_outcome: same_claim
          relation: equivalent
      - answer: not_same_claim
        candidate:
          same_claim: false
          resolution_outcome: not_same_claim
          relation: >-
            the judge's directional relation, accepted as A_stronger or
            B_stronger only with a recorded binder alignment per
            semantic_policy_v1 section 3; otherwise incomparable_near_miss
            or unrelated as stated, else unknown
      - answer: ambiguous
        candidate: terminal_ambiguity_candidate
        note: >-
          becomes terminal only through the gold_human or benchmark
          contract in section 6; from a judge alone it feeds review or
          consensus.
      - answer: uncertain
        candidate: unresolved_review_route
        note: no terminal label
      - answer: malformed_or_unparseable
        candidate: unresolved_review_route
        note: no terminal label; parse_status recorded on the LLM call record
  ui_to_canonical:
    # UI widget spellings (PLAN.md 14.4). Human UI answers feed the
    # adjudication workflow and may become terminal gold_human labels.
    table:
      - input: same_claim              # displayed "same claim"
        maps_to: {resolution_outcome: same_claim, same_claim: true}
      - input: not_same_claim          # displayed "not same claim"
        maps_to: {resolution_outcome: not_same_claim, same_claim: false}
      - input: ambiguous
        maps_to: terminal_ambiguity_candidate   # section 6 contract after adjudication
      - input: cannot_assess_yet       # displayed "cannot assess yet"
        maps_to: unresolved_review_route
      - input: related_neither_directional_claim
        maps_to: {relation: incomparable_near_miss}
        note: explanatory UI phrase; serializes as incomparable_near_miss
    unmatched: >-
      decision: any other UI value is a client bug; the submission is
      rejected at the API boundary rather than coerced.
  error_codes_note: >-
    error_types stores only E01-E30 IDs; names and definitions come from
    policies/error_ontology_v1.yaml (PLAN.md 14.3).
