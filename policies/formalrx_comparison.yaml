policy_version: formalrx_comparison_v1
direct_comparison:
  leanfaith_system: M4_NL
  shared_inputs: [natural_language, candidate_lean]
  shared_labels: human_aligned_misaligned
unequal_information_comparison:
  leanfaith_system: M4_reference_aware
  inputs: [natural_language, reference_lean, candidate_lean]
  claim_scope: end_to_end_system_only
forbidden_direct_comparison: M2_or_M3_quality_vs_FormalRx
calibration:
  partition: calibration_gold
  separate_per_system: true
  discrete_only_adapter_claims: forbidden
runtime:
  batch_sizes: [1, 32]
  warmup_batches: 20
  timed_batches: 100
  report_tokenization_separately: true
h7:
  metric: AUPRC
  simultaneous_one_sided_lower_bound_margin: -0.02
  efficiency_claim_requires:
    - higher_median_throughput
    - lower_peak_memory
  fixed_multiplier_required: false
