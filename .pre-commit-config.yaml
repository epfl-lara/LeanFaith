repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # Frozen prompts may intentionally end a prefix with one space.
        exclude: ^prompts/autoformalizers/goedel_card_chat_v1\.txt$
      - id: end-of-file-fixer
        # Reports, frozen benchmark registries, raw provider/replay artifacts,
        # generated LF-022 freeze artifacts, and gate fixtures are
        # content-addressed; byte-normalization would invalidate their
        # recorded hashes.
        exclude: ^(reports/|data/benchmarks/|data/raw/llm_variants/|tests/fixtures/gates/|configs/generation/lf022_(codex_catalog_snapshot_v1|rcp_catalog_snapshot_v1|production_family_matrix_v1)\.json$)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Frozen hash-only benchmark/frame artifacts are intentionally tracked;
        # the largest current artifact is below 4 MiB and GitHub's file limit.
        args: [--maxkb=5000]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
