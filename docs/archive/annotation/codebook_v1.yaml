annotation_design:
  annotator_slots_per_item: 2
  slots:
    - slot_id: independent_annotator_1
      annotator_assignment: not_materialized
    - slot_id: independent_annotator_2
      annotator_assignment: not_materialized
  independence:
    discussion_before_both_submissions_locked: forbidden
    show_other_slot_response: false
    show_other_slot_identity: false
    raw_submission_mutable: false
  fixed_side_semantics:
    A: registered_reference_lean_statement
    B: candidate_autoformalization_lean_statement
    swap_sides_in_ui: false

display_contract:
  mode: reference_assisted_nl_plus_lean_a_b
  required:
    - field: natural_language_statement
      label: Natural-language claim
      source_role: trusted_problem_statement
    - field: lean_a.headless
      label: Lean A - reference - headless
      source_role: registered_reference
    - field: lean_a.signature_pp
      label: Lean A - reference - normalized signature
      source_role: registered_reference
    - field: lean_a.signature_explicit
      label: Lean A - reference - explicit signature
      source_role: registered_reference
    - field: lean_b.headless
      label: Lean B - candidate - headless
      source_role: candidate_autoformalization
    - field: lean_b.signature_pp
      label: Lean B - candidate - normalized signature
      source_role: candidate_autoformalization
    - field: lean_b.signature_explicit
      label: Lean B - candidate - explicit signature
      source_role: candidate_autoformalization
  optional_permitted_context:
    - minimal_import_text
    - namespace_text
    - local_notation_text
    - required_type_information
    - neutral_view_unavailable_notice
    - pinned_definition_lookup_text
  definition_lookup_rule: >-
    A lookup is permitted only when a constant in A or B cannot otherwise be
    interpreted. The lookup must use the pinned Lean environment and be
    recorded in the rationale; no unblinded source path or identifier may be
    copied into the response.
  forbidden_model_views:
    - raw_proof_stripped
    - semantic_atoms
    - operator_tree
    - alpha_identity_fingerprint
    - alpha_structural
    - notation_light

response_fields:
  same_claim:
    required: true
    values:
      - same_claim
      - not_same_claim
      - ambiguous
      - cannot_assess_yet
  relation:
    required: true
    nullable: true
    values:
      - equivalent
      - A_stronger
      - B_stronger
      - incomparable
      - unrelated
      - ambiguous
  confidence:
    required: true
    type: integer
    minimum: 1
    maximum: 5
  rationale:
    required: true
    type: string
    minimum_non_whitespace_length_when:
      - same_claim=not_same_claim
      - same_claim=ambiguous
      - same_claim=cannot_assess_yet
  reference_issue:
    required: true
    values:
      - none
      - suspected
      - definite
  error_types:
    required: false
    role: optional_analysis_metadata_only
    values: E01_through_E30

combination_rules:
  - when: same_claim=same_claim
    require: relation=equivalent
  - when: same_claim=not_same_claim
    require_relation_in:
      - A_stronger
      - B_stronger
      - incomparable
      - unrelated
  - when: same_claim=ambiguous
    require: relation=ambiguous
  - when: same_claim=cannot_assess_yet
    require: relation=null
  - when: same_claim=cannot_assess_yet
    derived_workflow:
      resolution_outcome: unresolved
      quality_tier: unknown
      requires_adjudication: true
      decision: REVIEW
  - when: same_claim=ambiguous
    derived_workflow:
      same_claim: null
      resolution_outcome: ambiguous
      relation: ambiguous
      requires_adjudication: false

adjudication_triggers:
  - same_claim_disagreement
  - terminal_relation_disagreement
  - either_response_cannot_assess_yet
  - either_reference_issue_definite
  - either_confidence_at_most_2
  - versioned_policy_trigger

